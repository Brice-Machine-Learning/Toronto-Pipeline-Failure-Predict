[project]
name = "toronto-pipeline-failure-predict"
version = "0.1.0"
description = "Pipeline failure analytics and risk modeling platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
]

deploy = [
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
]

reports = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [
    "notebooks/",
]

