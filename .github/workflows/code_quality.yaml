name: Code Quality

on:
  push:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project (editable)
        run: |
          pip install -e .

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Lint codebase
        run: |
          ruff check .

      - name: Import smoke test
        run: |
          python - <<EOF
          import municipal_pipeline_failure_predict
          print("Import successful")
          EOF
