name: Code Quality

on:
  push:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Lint codebase
        run: |
          uv run ruff check .

      - name: Import smoke test
        run: |
          uv run python - <<EOF
          import toronto_pipeline_failure_predict
          print("Import successful")
          EOF
